  elaborated_expression_hash: null
  environment_fingerprint: null
domain_and_universes: >-
  Planned: an algebraically closed field k; homogeneous nonzero polynomials in three
  variables (or equivalent projective plane curves); projective intersection points.
  The precise mathlib object model and universes remain to be frozen.
quantifiers:
  - "algebraically closed field k"
  - "projective plane curves C and D over k"
hypotheses:
  - "C and D have no common irreducible component"
  - "the curve encodings have well-defined finite degrees"
conclusion: >-
  Sum of local intersection multiplicities equals deg(C) * deg(D), hence the number
  of distinct intersection points is at most deg(C) * deg(D).
