theorem_id: THM-M-0104
canonical_name: "Bezout theorem (plane algebraic curves)"
canonical_statement: >-
  Planned scope: for two projective plane curves over an algebraically closed field,
  with no common irreducible component, the intersection multiplicities over all
  intersection points sum to the product of their degrees.  Consequently the number
  of distinct intersection points is at most that product.
