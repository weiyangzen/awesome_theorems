theorem_id: THM-M-0395
canonical_name: Faltings theorem (Mordell conjecture form)
canonical_statement: >-
  For every number field K and every smooth, proper, geometrically connected
  curve C over K of genus at least two, the set C(K) of K-rational points is finite.
canonical_formal_target:
  backend: lean4
  module: Stage1_Instances/THM-M-0395/Statement.lean
  declaration_or_expression: Stage1Rev56.THMM0395.Statement
  elaborated_source_sha256: de1bfb399ccec48a224e867c55f6eab12589e458949d6d409260be65f0920ba6
  environment_fingerprint: lean-4.29.0_mathlib-8a178386ffc0f5fef0b77738bb5449d50efeea95_manifest-321626c846f14bcae3019c2fa6fb25a8fe879c21094d22bf30badb3335cb2d81
domain_and_universes: >-
  Universe u; K : Type u with Field K and NumberField K; C : CurveOver K,
  containing a Scheme.{u}, its morphism to Spec K, and the five curve predicates.
quantifiers:
  - "for every number field K"
  - "for every curve C over K"
hypotheses:
  - C is smooth over K
  - C is proper over K
  - C is geometrically connected
  - genus(C) >= 2
conclusion: "the type/set of K-rational points C(K) is finite"
alternate_encodings:
  - target: "sections of C -> Spec K are finite"
    relationship: equal
    checked_witness: definition of Stage1Rev56.THMM0395.RationalPoint
  - target: "the universal set of K-rational sections is finite"
    relationship: equivalent
    checked_witness: Stage1Rev56.THMM0395.finite_points_iff_finite_univ
excluded_degenerate_cases:
  - curves of genus zero or one
  - non-number-field base fields
  - nonproper, nonsmooth, or geometrically disconnected objects
