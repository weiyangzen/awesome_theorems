theorem_id: THM-M-0395
canonical_name: Faltings theorem (Mordell conjecture form)
canonical_statement: >-
  For every number field K and every smooth, proper, geometrically connected
  curve C over K of genus at least two, the set C(K) of K-rational points is finite.
canonical_formal_target:
  backend: lean4
  module: AwesomeTheorems.Stage1.S1_M_008
  declaration_or_expression: AwesomeTheorems.Stage1.S1_M_008.StatementShape
  elaborated_expression_hash: pending:S56-M-0395-STATEMENT
  environment_fingerprint: pending:S56-M-0395-STATEMENT
domain_and_universes: >-
  K is a number field; C is a curve over K. The precise Lean universe and
  scheme/curve representation remain to be frozen by the statement phase.
quantifiers:
  - "for every number field K"
  - "for every curve C over K"
hypotheses:
  - C is smooth over K
  - C is proper over K
  - C is geometrically connected
  - genus(C) >= 2
conclusion: "the type/set of K-rational points C(K) is finite"
alternate_encodings:
  - target: "sections of C -> Spec K are finite"
    relationship: equal
    checked_witness: pending:S56-M-0395-STATEMENT
excluded_degenerate_cases:
  - curves of genus zero or one
  - non-number-field base fields
  - nonproper, nonsmooth, or geometrically disconnected objects
